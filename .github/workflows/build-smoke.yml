name: Build Smoke

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC

jobs:
  electron-entry-smoke:
    runs-on: macos-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Belt-and-suspenders: confirm postinstall produced correct-arch
      # binaries. CI runners are macos-latest (arm64), so x86_64 here
      # means the install itself was poisoned. Mirrors the developer-side
      # pre-commit + boot-time gates in main.ts.
      - name: Verify native module architecture
        run: node scripts/verify-native-arch.js

      - name: Typecheck Electron main process
        run: npm run typecheck:electron

      - name: Build renderer
        run: npm run build

      - name: Build Electron main process
        run: npm run build:electron

      - name: Verify packaged entrypoint exists
        run: test -f dist-electron/electron/main.js

      # Required packaged local-fallback assets (ONNX/Transformers deps +
      # bundled MiniLM/MobileBERT models + local ONNX worker scripts). Fail the
      # build here if any required core-fallback asset is missing — the app must
      # work on a clean machine with no Ollama and no API keys.
      - name: Verify required local models present
        run: node scripts/download-models.js --verify

      - name: Verify packaged local fallback assets (source mode)
        run: npm run verify:packaged-local-assets

      # Keep this workflow a true smoke test. The complete Electron suite spans
      # hundreds of files and belongs in the full CI/nightly test workflow; it
      # can also be held open by a leaked timer in an unrelated test. These
      # focused files cover startup/packaging, provider routing, native audio,
      # streaming, code verification, and local RAG wiring.
      - name: Run focused Electron smoke tests
        run: |
          node --test \
            electron/services/__tests__/NewUserPcHardening2026_07_07.test.mjs \
            electron/services/__tests__/ProviderGatewayPolicy.test.mjs \
            electron/audio/__tests__/CaptureRestartRegression.test.mjs \
            electron/audio/__tests__/NativeDodoSoftRequired.test.mjs \
            electron/rag/__tests__/OnnxWorkerIsolationHardening2026_07_05.test.mjs \
            electron/llm/__tests__/TextStreamFallback.test.mjs \
            electron/llm/codeVerification/__tests__/VerificationFlag.test.mjs \
            electron/update/AppState.isRealUpgrade.test.mjs

      - name: Run intelligence unit tests
        run: npm run test:intelligence

      # Covers src/lib/__tests__ and src/lib/onboarding/__tests__ (renderer-side
      # onboarding orchestrator/stageCatalog, overlay state, etc.). Previously
      # unwired: no CI job ran these, including the regression invariant added
      # for the quiet_window drain-loop OOM crash. --experimental-strip-types
      # lets the suite import stageCatalog.ts directly (not just its .mjs test
      # mirror), so a real production-catalog regression fails CI, not just the
      # hand-maintained mirror.
      - name: Run src/lib unit tests
        run: npm run test:lib

  api-smoke:
    # Runs weekly (Monday 09:00 UTC) and on demand via workflow_dispatch.
    # Requires secrets: NATIVELY_API_KEY (or NATIVELY_TRIAL_TOKEN) set in repo.
    # Without credentials the suite is skipped cleanly via the env gate.
    name: API Smoke (weekly)
    runs-on: macos-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron (test prerequisite)
        run: npm run build:electron

      - name: Run API smoke tests
        run: node --test electron/services/__tests__/NativelyApiE2E.test.mjs
        env:
          RUN_NATIVELY_API_E2E: ${{ secrets.RUN_NATIVELY_API_E2E }}
          NATIVELY_API_KEY: ${{ secrets.NATIVELY_API_KEY }}
          NATIVELY_TRIAL_TOKEN: ${{ secrets.NATIVELY_TRIAL_TOKEN }}
          NATIVELY_API_BASE: ${{ secrets.NATIVELY_API_BASE }}
